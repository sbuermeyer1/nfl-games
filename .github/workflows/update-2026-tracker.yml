name: Update 2026 tracker data

on:
  workflow_dispatch:
  schedule:
    - cron: "0,15,30,45 * * 8-12,1-2 *"

permissions:
  contents: write

concurrency:
  group: nfl-generated-data-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Dry-run tracker update
        if: vars.ENABLE_OFFICIAL_TRACKER != 'true'
        run: python scripts/update_live_tracker.py --dry-run
      - name: Write tracker update
        if: vars.ENABLE_OFFICIAL_TRACKER == 'true'
        run: python scripts/update_live_tracker.py --write
      - name: Commit changed tracker artifact
        if: vars.ENABLE_OFFICIAL_TRACKER == 'true'
        shell: bash
        run: |
          git add data/processed/tracker_ledger.parquet
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: update 2026 tracker artifact"
          git fetch origin master
          git merge-base --is-ancestor origin/master HEAD
          git push origin HEAD:master
